<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmployeeHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 5px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 35px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .welcome h2 {
            margin-top: 0;
            font-size: 30px;
            color: #1f2937;
        }

        .welcome p {
            color: #6b7280;
            font-size: 16px;
        }

        .buttons {
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            margin: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>EmployeeHub</h1>
        <p>Employee Management Portal</p>
    </div>

    <div class="container">

        <div class="welcome">
            <h2>Welcome to EmployeeHub</h2>

            <p>
                Manage employee information quickly and efficiently.
            </p>

            <div class="buttons">
                <a href="/view-employees" class="button">View Employees</a>
                <a href="/add-employee" class="button">Add Employee</a>
            </div>
        </div>

    </div>

</body>
</html>
