<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Employees - EmployeeHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin: 5px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #1f2937;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>EmployeeHub</h1>
        <p>Employee Management Portal</p>
    </div>

    <div class="container">

        <h2>Employee List</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Role</th>
                    <th>Salary</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="employeeTableBody">
            </tbody>
        </table>

        <a href="/" class="back">← Back to Dashboard</a>

    </div>

<script>
    fetch("/employees")
        .then(response => response.json())
        .then(employees => {

            const tableBody = document.getElementById("employeeTableBody");

            employees.forEach(employee => {

                const row = document.createElement("tr");

                row.innerHTML = `
                     <td>${employee.id}</td>
                     <td>${employee.name}</td>
                     <td>${employee.email}</td>
                     <td>${employee.department}</td>
                     <td>${employee.role}</td>
                     <td>${employee.salary}</td>
                 <td>
    <a href="/edit-employee?id=${employee.id}">Update</a>
    <button onclick="deleteEmployee(${employee.id})">Delete</button>
     </td>
`;

                tableBody.appendChild(row);
            });
        })
        .catch(error => {
            console.error("Error loading employees:", error);
        });


      function deleteEmployee(id) {
    if (confirm("Are you sure you want to delete this employee?")) {
        fetch(`/employees/${id}`, {
            method: "DELETE"
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to delete employee");
            }

            alert("Employee deleted successfully!");
            loadEmployees();
        })
        .catch(error => {
            alert("Error deleting employee");
            console.error(error);
        });
    }
   }
</script>

</body>
</html>
